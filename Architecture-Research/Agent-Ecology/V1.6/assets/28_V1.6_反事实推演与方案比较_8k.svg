ology / 模型版本</text><path d="M960 330L960 410" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M950 402L960 410L950 418" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="80" y="420" width="390" height="200" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M102 422H448" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="275.0" y="459" text-anchor="middle" class="h">Branch A｜保持现状</text><text x="275.0" y="496" text-anchor="middle" class="b">No intervention</text><text x="275.0" y="524" text-anchor="middle" class="b">基线结果分布</text><path d="M960 410L275 405" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M265 397L275 405L265 413" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="535" y="420" width="390" height="200" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M557 422H903" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="730.0" y="459" text-anchor="middle" class="h">Branch B｜资源重分配</text><text x="730.0" y="496" text-anchor="middle" class="b">do(quota = q2)</text><text x="730.0" y="524" text-anchor="middle" class="b">效率 / 公平 / 风险</text><path d="M960 410L730 405" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M720 397L730 405L720 413" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="990" y="420" width="390" height="200" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M1012 422H1358" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1185.0" y="459" text-anchor="middle" class="h">Branch C｜Agent 替换</text><text x="1185.0" y="496" text-anchor="middle" class="b">do(agent = a2)</text><text x="1185.0" y="524" text-anchor="middle" class="b">质量 / 成本 / 时延</text><path d="M960 410L1185 405" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M1175 397L1185 405L1175 413" stroke="#24D8F2" strok