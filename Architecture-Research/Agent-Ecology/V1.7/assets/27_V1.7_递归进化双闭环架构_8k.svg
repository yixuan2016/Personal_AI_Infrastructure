<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".6" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient><linearGradient id="glass"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".13"/></pattern><style>.t{font-family:'Noto Sans CJK SC',sans-serif;font-size:38px;font-weight:700;fill:#F3F8FF}.st{font-family:'Noto Sans CJK SC',sans-serif;font-size:18px;fill:#B7C9D9}.h{font-family:'Noto Sans CJK SC',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}.b{font-family:'Noto Sans CJK SC',sans-serif;font-size:16px;fill:#B7C9D9}.s{font-family:'Noto Sans CJK SC',sans-serif;font-size:13px;fill:#B7C9D9}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/><text x="960" y="65" text-anchor="middle" class="t">V1.7｜递归进化双闭环架构</text><text x="960" y="104" text-anchor="middle" class="st">内环负责发现与实验；外环负责风险授权、审批、否决与接管</text><text x="1840" y="65" text-anchor="end" class="s">27 | DUAL LOOP</text><rect x="70" y="220" width="380" height="190" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M90 222H430" stroke="#24D8F2" stroke-width="2"/><text x="260.0" y="260" text-anchor="middle" class="h">内环 1｜Observe</text><text x="260.0" y="298" text-anchor="middle" class="b">生态状态 / 事件 / Trace</text><text x="260.0" y="326" text-anchor="middle" class="b">失败与验收结果</text><rect x="510" y="220" width="380" height="190" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M530 222H870" stroke="#3B91FF" stroke-width="2"/><text x="700.0" y="260" text-anchor="middle" class="h">内环 2｜Diagnose</text><text x="700.0" y="298" text-anchor="middle" class="b">假设 / 根因 / 反证</text><text x="700.0" y="326" text-anchor="middle" class="b">问题优先级</text><rect x="950" y="220" width="380" height="190" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M970 222H1310" stroke="#A78BFA" stroke-width="2"/><text x="1140.0" y="260" text-anchor="middle" class="h">内环 3｜Design</text><text x="1140.0" y="298" text-anchor="middle" class="b">多候选 / 变更差异</text><text x="1140.0" y="326" text-anchor="middle" class="b">预算 / 回滚方案</text><rect x="1390" y="220" width="450" height="190" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M1410 222H1820" stroke="#FFC76A" stroke-width="2"/><text x="1615.0" y="260" text-anchor="middle" class="h">内环 4｜Experiment</text><text x="1615.0" y="298" text-anchor="middle" class="b">Sandbox / Twin / Hidden Eval</text><text x="1615.0" y="326" text-anchor="middle" class="b">结果 / 不确定性</text><path d="M450 315L500 315" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M490 307L500 315L490 323" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M890 315L940 315" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M930 307L940 315L930 323" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1330 315L1380 315" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1370 307L1380 315L1370 323" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="180" y="650" width="450" height="200" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M200 652H610" stroke="#FF6D7A" stroke-width="2"/><text x="405.0" y="690" text-anchor="middle" class="h">外环 1｜Scope &amp; Authorize</text><text x="405.0" y="728" text-anchor="middle" class="b">目标 / 风险 / 预算 / 数据范围</text><text x="405.0" y="756" text-anchor="middle" class="b">授权期限 / 责任主体</text><rect x="735" y="650" width="450" height="200" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M755 652H1165" stroke="#FF6D7A" stroke-width="2"/><text x="960.0" y="690" text-anchor="middle" class="h">外环 2｜Review &amp; Decide</text><text x="960.0" y="728" text-anchor="middle" class="b">独立评估 / 人类审批</text><text x="960.0" y="756" text-anchor="middle" class="b">Approve / Deny / Hold</text><rect x="1290" y="650" width="450" height="200" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M1310 652H1720" stroke="#FF6D7A" stroke-width="2"/><text x="1515.0" y="690" text-anchor="middle" class="h">外环 3｜Release Governance</text><text x="1515.0" y="728" text-anchor="middle" class="b">Shadow / Canary / Monitor</text><text x="1515.0" y="756" text-anchor="middle" class="b">Revoke / Rollback / Audit</text><path d="M1600 410L410 640" stroke="#FFC76A" stroke-width="3" fill="none" stroke-dasharray="8 7"/><path d="M400 632L410 640L400 648" stroke="#FFC76A" stroke-width="3" fill="none"/><path d="M630 750L725 750" stroke="#FF6D7A" stroke-width="3" fill="none"/><path d="M715 742L725 750L715 758" stroke="#FF6D7A" stroke-width="3" fill="none"/><path d="M1185 750L1280 750" stroke="#FF6D7A" stroke-width="3" fill="none"/><path d="M1270 742L1280 750L1270 758" stroke="#FF6D7A" stroke-width="3" fill="none"/><text x="960" y="970" text-anchor="middle" class="b">内环不得跳过外环；外环故障或审批不可用时，停止新版本发布，稳定版本保持运行</text></svg>