<text x="960" y="66" text-anchor="middle" class="t">V1.5｜能力信誉：从声明走向证据</text>
<text x="960" y="106" text-anchor="middle" class="st">信誉按 Agent × 能力 × 领域 × 任务类别 × 版本分层</text>
<text x="1845" y="66" text-anchor="end" class="s">28 | CAPABILITY REPUTATION</text><rect x="60" y="230" width="300" height="190" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M82 232H338" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="210.0" y="269" text-anchor="middle" class="h">E0 声明</text><text x="210.0" y="306" text-anchor="middle" class="b">Agent Card / 自述</text><text x="210.0" y="334" text-anchor="middle" class="b">仅用于发现</text><rect x="420" y="230" width="300" height="190" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M442 232H698" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="570.0" y="269" text-anchor="middle" class="h">E1 基准测试</text><text x="570.0" y="306" text-anchor="middle" class="b">自动化测试 / 契约</text><text x="570.0" y="334" text-anchor="middle" class="b">限定测试范围</text><rect x="780" y="230" width="300" height="190" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M802 232H1058" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="930.0" y="269" text-anchor="middle" class="h">E2 真实验收</text><text x="930.0" y="306" text-anchor="middle" class="b">成果 / 质量 / 复现</text><text x="930.0" y="334" text-anchor="middle" class="b">任务证据</text><rect x="1140" y="230" width="300" height="190" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M1162 232H1418" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1290.0" y="269" text-anchor="middle" class="h">E3 独立复核</text><text x="1290.0" y="306" text-anchor="middle" class="b">不同验证者 / 场景</text><text x="1290.0" y="334" text-anchor="middle" class="b">反证和抽查</text><rect x="1500" y="230" width="360" height="190" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M1522 232H1838" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1680.0" y="26