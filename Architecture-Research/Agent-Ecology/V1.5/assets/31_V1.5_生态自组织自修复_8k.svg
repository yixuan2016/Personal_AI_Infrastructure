<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:38px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:18px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:16px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:13px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="66" text-anchor="middle" class="t">V1.5｜生态自组织与自修复</text>
<text x="960" y="106" text-anchor="middle" class="st">先保护状态和权限，再替换角色；不能为了恢复而扩大授权</text>
<text x="1845" y="66" text-anchor="end" class="s">31 | SELF-ORGANIZING REPAIR</text><rect x="60" y="240" width="340" height="200" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M82 242H378" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="230.0" y="279" text-anchor="middle" class="h">Detect</text><text x="230.0" y="316" text-anchor="middle" class="b">心跳 / 租约 / 质量</text><text x="230.0" y="344" text-anchor="middle" class="b">成本 / 安全 / 依赖</text><rect x="460" y="240" width="340" height="200" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M482 242H778" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="630.0" y="279" text-anchor="middle" class="h">Contain</text><text x="630.0" y="316" text-anchor="middle" class="b">隔离主体 / 任务</text><text x="630.0" y="344" text-anchor="middle" class="b">冻结旧 Fencing</text><rect x="860" y="240" width="340" height="200" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M882 242H1178" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1030.0" y="279" text-anchor="middle" class="h">Recompose</text><text x="1030.0" y="316" text-anchor="middle" class="b">角色替换 / 联盟重组</text><text x="1030.0" y="344" text-anchor="middle" class="b">拆分剩余任务</text><rect x="1260" y="240" width="340" height="200" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M1282 242H1578" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1430.0" y="279" text-anchor="middle" class="h">Recover</text><text x="1430.0" y="316" text-anchor="middle" class="b">检查点 / 幂等对账</text><text x="1430.0" y="344" text-anchor="middle" class="b">受限授权接续</text><rect x="1660" y="240" width="220" height="200" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M1682 242H1858" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1770.0" y="279" text-anchor="middle" class="h">Verify</text><text x="1770.0" y="316" text-anchor="middle" class="b">独立验收</text><text x="1770.0" y="344" text-anchor="middle" class="b">留痕</text><path d="M400 340L455 340" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M445 332L455 340L445 348" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M800 340L855 340" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M845 332L855 340L845 348" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1200 340L1255 340" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1245 332L1255 340L1245 348" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1600 340L1655 340" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1645 332L1655 340L1645 348" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="250" y="680" width="620" height="190" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M272 682H848" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="560.0" y="719" text-anchor="middle" class="h">Safe Recovery</text><text x="560.0" y="756" text-anchor="middle" class="b">R0-R3：重试、恢复、替换、重组</text><text x="560.0" y="784" text-anchor="middle" class="b">必须满足幂等、授权、租约和预算</text><rect x="1050" y="680" width="620" height="190" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M1072 682H1648" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1360.0" y="719" text-anchor="middle" class="h">Human Takeover</text><text x="1360.0" y="756" text-anchor="middle" class="b">R4-R5：隔离、撤权、事故接管</text><text x="1360.0" y="784" text-anchor="middle" class="b">高风险或外部副作用不确定时升级</text><path d="M960 440L560 660" stroke="#27E0B1" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M550 652L560 660L550 668" stroke="#27E0B1" stroke-width="3" fill="none"/><path d="M960 440L1360 660" stroke="#FF6D7A" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M1350 652L1360 660L1350 668" stroke="#FF6D7A" stroke-width="3" fill="none"/></svg>