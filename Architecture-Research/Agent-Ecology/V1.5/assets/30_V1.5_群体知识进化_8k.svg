<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:38px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:18px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:16px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:13px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="66" text-anchor="middle" class="t">V1.5｜群体知识进化生命周期</text>
<text x="960" y="106" text-anchor="middle" class="st">个体经验不直接成为公共知识；必须经历证据、验证、Shadow 和发布</text>
<text x="1845" y="66" text-anchor="end" class="s">30 | KNOWLEDGE EVOLUTION</text><rect x="55" y="280" width="330" height="210" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M77 282H363" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="220.0" y="319" text-anchor="middle" class="h">Experience</text><text x="220.0" y="356" text-anchor="middle" class="b">任务观察 / Trace</text><path d="M385 385L415 385" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M405 377L415 385L405 393" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="425" y="280" width="330" height="210" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M447 282H733" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="590.0" y="319" text-anchor="middle" class="h">Candidate</text><text x="590.0" y="356" text-anchor="middle" class="b">事实 / 方法 / 反例</text><path d="M755 385L785 385" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M775 377L785 385L775 393" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="795" y="280" width="330" height="210" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M817 282H1103" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="319" text-anchor="middle" class="h">Evidence Review</text><text x="960.0" y="356" text-anchor="middle" class="b">来源 / 独立性 / 反证</text><path d="M1125 385L1155 385" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1145 377L1155 385L1145 393" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="1165" y="280" width="330" height="210" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M1187 282H1473" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1330.0" y="319" text-anchor="middle" class="h">Domain Validation</text><text x="1330.0" y="356" text-anchor="middle" class="b">测试 / Shadow / 评审</text><path d="M1495 385L1525 385" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1515 377L1525 385L1515 393" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="1535" y="280" width="330" height="210" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M1557 282H1843" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1700.0" y="319" text-anchor="middle" class="h">Governed Release</text><text x="1700.0" y="356" text-anchor="middle" class="b">版本 / 灰度 / 回滚</text><rect x="220" y="700" width="1480" height="160" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M242 702H1678" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="739" text-anchor="middle" class="h">Knowledge Scope</text><text x="960.0" y="776" text-anchor="middle" class="b">个人记忆｜领域知识｜ADS 公共语义/模板：分别拥有、分别验证、显式采用</text><text x="960.0" y="804" text-anchor="middle" class="b">策略知识必须人类审批；知识发布不能自动改变授权和根策略</text></svg>