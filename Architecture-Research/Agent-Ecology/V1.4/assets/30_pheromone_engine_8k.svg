.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:18px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:16px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:13px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="66" text-anchor="middle" class="t">V1.4｜数字信息素引擎</text>
<text x="960" y="106" text-anchor="middle" class="st">多维证据排序、来源簇去重、时间衰减、反证和隔离</text>
<text x="1845" y="66" text-anchor="end" class="s">30 | PHEROMONE ENGINE</text><rect x="40" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M62 272H288" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="175.0" y="309" text-anchor="middle" class="h">Ingest</text><text x="175.0" y="346" text-anchor="middle" class="b">Schema / 身份 / 来源</text><path d="M310 365L340 365" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M330 357L340 365L330 373" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="350" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M372 272H598" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="485.0" y="309" text-anchor="middle" class="h">Normalize</text><text x="485.0" y="346" text-anchor="middle" class="b">时间 / 实体 / 语义</text><path d="M620 365L650 365" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M640 357L650 365L640 373" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="660" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M682 272H908" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="795.0" y="309" text-anchor="middle" class="h">Deduplicate</text><text x="795.0" y="346" text-anchor="middle" class="b">同源簇 / 近重复</text><path d="M930 365L960 365" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M950 357L960 365L950 373" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="970" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M992 272H1218" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1105.0" y="309" text-anchor="middle" class="h">Verify</text><text x="1105.0" y="346" text-anchor="middle" class="b">证据 / 独立性 / 反证</text><path d="M1240 365L1270 365" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1260 357L1270 365L1260 373" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="1280" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M1302 272H1528" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1415.0" y="309" text-anchor="middle" class="h">Score &amp; Decay</text><text x="1415.0" y="346" text-anchor="middle" class="b">相关 / 新鲜 / 风险</text><path d="M1550 365L1580 365" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1570 357L1580 365L1570 373" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="1590" y="270" width="270" height="190" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M1612 272H1838" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1725.0" y="309" text-anchor="middle" class="h">Project</text><text x="1725.0" y="346" text-anchor="middle" class="b">权限过滤 / 排序</text><rect x="170" y="680" width="700" height="190" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M192 682H848" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="520.0" y="719" text-anchor="middle" class="h">正常候选池</text><text x="520.0" y="756" text-anchor="middle" class="b">可发现、可订阅、可进一步核验</text><text x="520.0" y="784" text-anchor="middle" class="b">排序信号不代表事实或授权</text><rect x="1050" y="680" width="700" height="190" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M1072 682H1728" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1400.0" y="719" text-anchor="middle" class="h">隔离与争议池</text><text x="1400.0" y="756" text-anchor="middle" class="b">污染、异常、反证、过期</text><text x="1400.0" y="784" text-anchor="middle" class="b">复核、撤销引用、受控恢复</text><path d="M1420 460L520 660" stroke="#27E0B1" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M510 652L520 660L510 668"