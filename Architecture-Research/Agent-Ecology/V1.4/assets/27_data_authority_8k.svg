<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:38px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:18px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:16px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:13px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="66" text-anchor="middle" class="t">V1.4｜权威数据与派生投影边界</text>
<text x="960" y="106" text-anchor="middle" class="st">状态是事实源，事件是已提交变化，Trace 是证据，Artifact 是版本化成果</text>
<text x="1845" y="66" text-anchor="end" class="s">27 | DATA AUTHORITY</text><rect x="80" y="210" width="520" height="230" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M102 212H578" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="340.0" y="249" text-anchor="middle" class="h">State Store</text><text x="340.0" y="286" text-anchor="middle" class="b">Task 当前权威状态</text><text x="340.0" y="314" text-anchor="middle" class="b">CAS / state_version</text><text x="340.0" y="342" text-anchor="middle" class="b">合法状态转换</text><rect x="700" y="210" width="520" height="230" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M722 212H1198" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="249" text-anchor="middle" class="h">Domain Event Log</text><text x="960.0" y="286" text-anchor="middle" class="b">Outbox / 已提交事件</text><text x="960.0" y="314" text-anchor="middle" class="b">aggregate_version</text><text x="960.0" y="342" text-anchor="middle" class="b">可重放投影</text><rect x="1320" y="210" width="520" height="230" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M1342 212H1818" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1580.0" y="249" text-anchor="middle" class="h">Trace Ledger</text><text x="1580.0" y="286" text-anchor="middle" class="b">观察 / 证据 / 反证</text><text x="1580.0" y="314" text-anchor="middle" class="b">来源 / 因果 / 追加</text><text x="1580.0" y="342" text-anchor="middle" class="b">不可静默覆盖</text><path d="M600 320L690 320" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M680 312L690 320L680 328" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1220 320L1310 320" stroke="#A78BFA" stroke-width="3" fill="none"/><path d="M1300 312L1310 320L1300 328" stroke="#A78BFA" stroke-width="3" fill="none"/><rect x="180" y="630" width="700" height="220" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M202 632H858" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="530.0" y="669" text-anchor="middle" class="h">Artifact Registry</text><text x="530.0" y="706" text-anchor="middle" class="b">内容哈希 / 不可变版本</text><text x="530.0" y="734" text-anchor="middle" class="b">受控引用 / 保留策略</text><rect x="1040" y="630" width="700" height="220" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M1062 632H1718" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1390.0" y="669" text-anchor="middle" class="h">Ontology &amp; Policy Registry</text><text x="1390.0" y="706" text-anchor="middle" class="b">语义版本 / 兼容迁移</text><text x="1390.0" y="734" text-anchor="middle" class="b">策略版本 / 撤权记录</text><path d="M960 440L530 610" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M520 602L530 610L520 618" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M960 440L1390 610" stroke="#FFC76A" stroke-width="3" fill="none" stroke-dasharray="9 7"/><path d="M1380 602L1390 610L1380 618" stroke="#FFC76A" stroke-width="3" fill="none"/></svg>