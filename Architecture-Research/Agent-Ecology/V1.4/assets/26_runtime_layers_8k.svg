<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:38px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:18px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:22px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:16px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:13px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="66" text-anchor="middle" class="t">V1.4｜Environment Runtime 七层逻辑架构</text>
<text x="960" y="106" text-anchor="middle" class="st">逻辑模块可先模块化部署，不要求首期拆成七个微服务</text>
<text x="1845" y="66" text-anchor="end" class="s">26 | RUNTIME LAYERS</text><rect x="100" y="165" width="1720" height="120" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M122 167H1798" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="204" text-anchor="middle" class="h">Agent Execution Layer</text><text x="960.0" y="241" text-anchor="middle" class="b">Agent Runtime｜工具适配器｜执行检查点</text><rect x="100" y="315" width="1720" height="120" rx="20" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.4"/><path d="M122 317H1798" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="354" text-anchor="middle" class="h">Environment API Layer</text><text x="960.0" y="391" text-anchor="middle" class="b">Runtime Gateway｜身份解析｜协议适配｜请求校验</text><rect x="100" y="465" width="1720" height="120" rx="20" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.4"/><path d="M122 467H1798" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="504" text-anchor="middle" class="h">Coordination Layer</text><text x="960.0" y="541" text-anchor="middle" class="b">State Coordinator｜Subscription &amp; Discovery｜Claim / Lease / Quota</text><rect x="100" y="615" width="1720" height="120" rx="20" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.4"/><path d="M122 617H1798" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="654" text-anchor="middle" class="h">Event Layer</text><text x="960.0" y="691" text-anchor="middle" class="b">Transactional Outbox｜Event Relay｜Inbox｜Retry / DLQ</text><rect x="100" y="765" width="1720" height="120" rx="20" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.4"/><path d="M122 767H1798" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="804" text-anchor="middle" class="h">Knowledge Layer</text><text x="960.0" y="841" text-anchor="middle" class="b">Trace &amp; Evidence Ledger｜Artifact Registry｜Ontology / Capability Registry</text><rect x="100" y="915" width="820" height="120" rx="20" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.4"/><path d="M122 917H898" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="510.0" y="954" text-anchor="middle" class="h">Governance Layer</text><text x="510.0" y="991" text-anchor="middle" class="b">ADS PDP｜Domain PEP｜Human Approval</text><rect x="1000" y="915" width="820" height="120" rx="20" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.4"/><path d="M1022 917H1798" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1410.0" y="954" text-anchor="middle" class="h">Storage &amp; Observability</text><text x="1410.0" y="991" text-anchor="middle" class="b">State DB｜Object Store｜Metrics / Logs / Traces</text></svg>