<rect x="1621" y="406" width="207" height="86" rx="12" fill="#1b3b5a" stroke="#5d94bf"/>
<text x="1639" y="439" class="body">连续水位</text><text x="1639" y="467" class="small">每 Domain / Feed 独立</text>
<rect x="1384" y="510" width="444" height="68" rx="12" fill="#214761" stroke="#7ce2c1"/>
