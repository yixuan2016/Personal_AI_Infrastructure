<text x="112" y="633" class="body">本地权威目录</text><text x="112" y="659" class="small">Owner Version · 不可变对象引用</text>

<rect x="710" y="258" width="500" height="448" rx="22" fill="url(#mid)" stroke="#72c5d9" stroke-width="2" filter="url(#shadow)"/>
