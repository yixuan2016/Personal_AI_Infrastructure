<text x="758" y="352" class="head">目录索引 / 事件中继</text><text x="758" y="376" class="small">缓存 · 路由 · 游标转发，不签发撤销</text>
<rect x="738" y="408" width="207" height="100" rx="12" fill="#1a405b" stroke="#7ce2c1"/>
<text x="756" y="443" class="body">反熵同步</text><text x="756" y="472" class="small">Merkle 差异定位</text><text x="756" y="494" class="small">快照/事件补洞</text>
<rect x="975" y="408" width="207" height="100" rx="12" fill="#1a405b" stroke="#f0c878"/>
