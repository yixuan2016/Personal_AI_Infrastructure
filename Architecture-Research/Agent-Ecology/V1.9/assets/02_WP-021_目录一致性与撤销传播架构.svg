<text x="92" y="298" class="section">来源生态｜权威事件源</text>
<rect x="92" y="320" width="444" height="68" rx="13" fill="#29496a" stroke="#78bce9"/>
<text x="112" y="350" class="head">Owner / Revocation Authority</text><text x="112" y="374" class="small">签发能力、Grant、Key、Member 撤销</text>
<rect x="92" y="406" width="444" height="86" rx="13" fill="#1b3b5a" stroke="#7ce2c1"/>
<text x="112" y="439" class="head">签名安全控制 Feed</text><text x="112" y="466" class="small">CloudEvents · source+id · feedSequence</text><text x="112" y="485" class="small">revocationEpoch · previousDigest · JWS</text>
<rect x="92" y="510" width="444" height="72" rx="13" fill="#1b3b5a" stroke="#5d94bf"/>
<text x="112" y="543" class="body">完整撤销快照 / Checkpoint</text><text x="112" y="568" class="small">完整墓碑集合 + Merkle Root + 签名</text>
