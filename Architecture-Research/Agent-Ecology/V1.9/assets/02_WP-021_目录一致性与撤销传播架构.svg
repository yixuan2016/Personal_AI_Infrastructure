<text x="758" y="638" class="body">分区 / 延迟 / 重复 / 乱序 / 历史压缩</text><text x="758" y="663" class="small">中继失败不得绕过本地撤销门禁</text>

<rect x="1356" y="258" width="500" height="448" rx="22" class="box" filter="url(#shadow)"/>
