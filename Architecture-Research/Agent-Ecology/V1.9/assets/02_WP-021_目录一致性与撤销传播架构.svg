<text x="1404" y="350" class="head">持久去重与事件验证</text><text x="1404" y="374" class="small">(source,id) · 签名 · 序列 · 摘要链</text>
<rect x="1384" y="406" width="207" height="86" rx="12" fill="#1b3b5a" stroke="#7ce2c1"/>
