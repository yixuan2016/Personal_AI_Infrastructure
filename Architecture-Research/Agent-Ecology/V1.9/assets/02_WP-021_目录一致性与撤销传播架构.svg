<rect x="1384" y="596" width="444" height="80" rx="12" fill="#245849" stroke="#7ce2c1"/>
<text x="1404" y="630" class="head">本地 PDP / PEP</text><text x="1404" y="657" class="small">Freshness Budget · DENY / HOLD / ALLOW</text>
<path d="M564 365 H700" class="line"/><text x="575" y="346" class="small">来源签名事件 / 快照</text>
<path d="M1210 365 H1346" class="line"/><text x="1217" y="346" class="small">中继 / 反熵 / Checkpoint</text>
<path d="M1356 465 H1215" class="mintline"/><text x="1220" y="489" class="small">缺口请求 / 对账</text>
<path d="M564 635 C650 760 1270 760 1356 635" class="goldline dash"/>
<text x="760" y="758" class="small">已知撤销立即写入墓碑；序列缺口仍保持 HOLD，直到补齐或验证完整快照</text>

<rect x="64" y="802" width="1792" height="208" rx="20" fill="#10243b" stroke="#52799b" stroke-width="2"/>
<text x="94" y="842" class="section">六个不可破坏的安全不变量</text>
<g>
 <rect x="94" y="864" width="270" height="88" rx="12" fill="#1b3b5a" stroke="#5d94bf"/><text x="112" y="895" class="head">① 来源权威</text><text x="112" y="925" class="small">FCP 只中继不签发</text>
 <rect x="382" y="864" width="270" height="88" rx="12" fill="#1b3b5a" stroke="#7ce2c1"/><text x="400" y="895" class="head">② 撤销单调</text><text x="400" y="925" class="small">墓碑只增不减</text>
 <rect x="670" y="864" width="270" height="88" rx="12" fill="#1b3b5a" stroke="#5d94bf"/><text x="688" y="895" class="head">③ 序列隔离</text><text x="688" y="925" class="small">只在同一 Feed 内排序</text>
 <rect x="958" y="864" width="270" height="88" rx="12" fill="#1b3b5a" stroke="#f0c878"/><text x="976" y="895" class="head">④ 缺口 HOLD</text><text x="976" y="925" class="small">不跳过未知历史</text>
 <rect x="1246" y="864" width="270" height="88" rx="12" fill="#1b3b5a" stroke="#5d94bf"/><text x="1264" y="895" class="head">⑤ 快照可验证</text><text x="1264" y="925" class="small">Root 不等于完整数据</text>
 <rect x="1534" y="864" width="294" height="88" rx="12" fill="#245849" stroke="#7ce2c1"/><text x="1552" y="895" class="head">⑥ 本地授权</text><text x="1552" y="925" class="small">PEP 不依赖 FCP</text>
</g>
<text x="94" y="984" class="small">安全目标：撤销墓碑不丢失 · 旧广告不复活 · 高风险无新鲜状态不执行 · FCP 离线本地仍可 DENY</text>
