<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:40px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:19px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:24px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:17px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="70" text-anchor="middle" class="t">V1.3｜数字信息素：正反馈与负反馈</text>
<text x="960" y="112" text-anchor="middle" class="st">提高可发现性不等于认定事实；所有痕迹必须可衰减、可反证、可隔离</text>
<text x="1845" y="70" text-anchor="end" class="s">20 | TRACE FEEDBACK</text><rect x="70" y="250" width="380" height="210" rx="22" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.5"/><path d="M94 252H426" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="260.0" y="292" text-anchor="middle" class="h">Agent 行动</text><text x="260.0" y="333" text-anchor="middle" class="b">观察 / 判断 / 执行</text><text x="260.0" y="364" text-anchor="middle" class="b">产生状态变化</text><rect x="540" y="250" width="380" height="210" rx="22" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.5"/><path d="M564 252H896" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="730.0" y="292" text-anchor="middle" class="h">Trace 留痕</text><text x="730.0" y="333" text-anchor="middle" class="b">来源 / 证据 / 因果</text><text x="730.0" y="364" text-anchor="middle" class="b">有效期 / 分类 / 版本</text><rect x="1010" y="250" width="380" height="210" rx="22" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.5"/><path d="M1034 252H1366" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1200.0" y="292" text-anchor="middle" class="h">环境投影</text><text x="1200.0" y="333" text-anchor="middle" class="b">索引 / 订阅 / 发现</text><text x="1200.0" y="364" text-anchor="middle" class="b">按权限提供上下文</text><rect x="1480" y="250" width="380" height="210" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M1504 252H1836" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1670.0" y="292" text-anchor="middle" class="h">其他 Agent</text><text x="1670.0" y="333" text-anchor="middle" class="b">筛选 / 认领 / 验证</text><text x="1670.0" y="364" text-anchor="middle" class="b">形成新的行动</text><path d="M450 355L540 355" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M530 347L540 355L530 363" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M920 355L1010 355" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1000 347L1010 355L1000 363" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1390 355L1480 355" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1470 347L1480 355L1470 363" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="200" y="700" width="680" height="200" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M224 702H856" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="540.0" y="742" text-anchor="middle" class="h">正反馈</text><text x="540.0" y="783" text-anchor="middle" class="b">独立验证 + 任务相关 + 新鲜度</text><text x="540.0" y="814" text-anchor="middle" class="b">提高可发现性，但不授予权限</text><rect x="1040" y="700" width="680" height="200" rx="22" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.5"/><path d="M1064 702H1696" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1380.0" y="742" text-anchor="middle" class="h">负反馈</text><text x="1380.0" y="783" text-anchor="middle" class="b">反证 / 过期 / 重复 / 来源污染</text><text x="1380.0" y="814" text-anchor="middle" class="b">降权、隔离、冷却和回滚</text><path d="M1190 460L560 680" stroke="#27E0B1" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M550 672L560 680L550 688" stroke="#27E0B1" stroke-width="3" fill="none"/><path d="M1660 460L1380 680" stroke="#FF6D7A" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M1370 672L1380 680L1370 688" stroke="#FF6D7A" stroke-width="3" fill="none"/></svg>