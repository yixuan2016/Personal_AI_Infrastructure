<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:40px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:19px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:24px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:17px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="70" text-anchor="middle" class="t">V1.3｜Agent Environment 五平面模型</text>
<text x="960" y="112" text-anchor="middle" class="st">共享环境不是共享聊天记录；权威状态、痕迹证据、成果版本、共同语义与治理权分层</text>
<text x="1845" y="70" text-anchor="end" class="s">19 | ENVIRONMENT</text><rect x="130" y="180" width="1660" height="135" rx="22" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.5"/><path d="M154 182H1766" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="222" text-anchor="middle" class="h">State Plane</text><text x="960.0" y="263" text-anchor="middle" class="b">任务状态 / 租约 / 依赖</text><text x="960.0" y="294" text-anchor="middle" class="b">权威状态机｜强约束写入</text><rect x="130" y="345" width="1660" height="135" rx="22" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.5"/><path d="M154 347H1766" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="387" text-anchor="middle" class="h">Trace Plane</text><text x="960.0" y="428" text-anchor="middle" class="b">观察 / 意图 / 风险 / 反证</text><text x="960.0" y="459" text-anchor="middle" class="b">追加式记录｜因果可追溯</text><rect x="130" y="510" width="1660" height="135" rx="22" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.5"/><path d="M154 512H1766" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="552" text-anchor="middle" class="h">Artifact Plane</text><text x="960.0" y="593" text-anchor="middle" class="b">文件 / 报告 / 数据 / 模型</text><text x="960.0" y="624" text-anchor="middle" class="b">版本化对象｜内容哈希</text><rect x="130" y="675" width="1660" height="135" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M154 677H1766" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="717" text-anchor="middle" class="h">Semantic Plane</text><text x="960.0" y="758" text-anchor="middle" class="b">Ontology / 能力契约</text><text x="960.0" y="789" text-anchor="middle" class="b">语义版本｜映射与迁移</text><rect x="130" y="840" width="1660" height="135" rx="22" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.5"/><path d="M154 842H1766" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="882" text-anchor="middle" class="h">Governance Plane</text><text x="960.0" y="923" text-anchor="middle" class="b">身份 / 策略 / 授权 / 审计</text><text x="960.0" y="954" text-anchor="middle" class="b">本地 PEP｜最小权限｜可撤权</text></svg>