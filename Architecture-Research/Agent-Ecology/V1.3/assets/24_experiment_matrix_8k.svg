<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:40px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:19px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:24px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:17px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="70" text-anchor="middle" class="t">V1.3｜五组对照实验与八类协作场景</text>
<text x="960" y="112" text-anchor="middle" class="st">同时比较质量、效率、成本、可靠性、公平性和安全性</text>
<text x="1845" y="70" text-anchor="end" class="s">24 | EXPERIMENT MATRIX</text><rect x="55" y="210" width="320" height="170" rx="22" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.5"/><path d="M79 212H351" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="215.0" y="252" text-anchor="middle" class="h">EXP-01</text><text x="215.0" y="293" text-anchor="middle" class="b">集中式</text><rect x="420" y="210" width="320" height="170" rx="22" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.5"/><path d="M444 212H716" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="580.0" y="252" text-anchor="middle" class="h">EXP-02</text><text x="580.0" y="293" text-anchor="middle" class="b">直接消息</text><rect x="785" y="210" width="320" height="170" rx="22" fill="url(#glass)" stroke="#24D8F2" stroke-width="2.5"/><path d="M809 212H1081" stroke="#24D8F2" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="945.0" y="252" text-anchor="middle" class="h">EXP-03</text><text x="945.0" y="293" text-anchor="middle" class="b">事件驱动</text><rect x="1150" y="210" width="320" height="170" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M1174 212H1446" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1310.0" y="252" text-anchor="middle" class="h">EXP-04</text><text x="1310.0" y="293" text-anchor="middle" class="b">纯痕迹</text><rect x="1515" y="210" width="320" height="170" rx="22" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.5"/><path d="M1539 212H1811" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1675.0" y="252" text-anchor="middle" class="h">EXP-05</text><text x="1675.0" y="293" text-anchor="middle" class="b">混合生态</text><rect x="100" y="500" width="1720" height="190" rx="22" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.5"/><path d="M124 502H1796" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="542" text-anchor="middle" class="h">八类场景</text><text x="960.0" y="583" text-anchor="middle" class="b">并行研究｜资源竞争｜顺序依赖｜Agent 失效｜跨域隐私｜错误痕迹｜突发任务｜RSI 灰度进化</text><rect x="100" y="790" width="1720" height="180" rx="22" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.5"/><path d="M124 792H1796" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="832" text-anchor="middle" class="h">联合评价</text><text x="960.0" y="873" text-anchor="middle" class="b">成果质量 / 端到端时延 / 通信 Token / 重复工作 / 交接失败 / 公平性 / 恢复时间 / 安全违规</text><path d="M215 380L215 480" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M205 472L215 480L205 488" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M580 380L580 480" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M570 472L580 480L570 488" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M945 380L945 480" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M935 472L945 480L935 488" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1310 380L1310 480" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M1300 472L1310 480L1300 488" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1675 380L1675 480" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M1665 472L1675 480L1665 488" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M960 690L960 770" stroke="#FFC76A" stroke-width="3" fill="none"/><path d="M950 762L960 770L950 778" stroke="#FFC76A" stroke-width="3" fill="none"/></svg>