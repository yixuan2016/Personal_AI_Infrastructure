<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:40px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:19px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:24px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:17px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="70" text-anchor="middle" class="t">V1.3｜ADS 生态协调与人类外环治理</text>
<text x="960" y="112" text-anchor="middle" class="st">ADS 不接管所有执行；它治理跨域协作条件，领域 Agent 保留专业自治</text>
<text x="1845" y="70" text-anchor="end" class="s">23 | ADS GOVERNANCE</text><rect x="60" y="250" width="500" height="260" rx="22" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.5"/><path d="M84 252H536" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="310.0" y="292" text-anchor="middle" class="h">领域生态 A</text><text x="310.0" y="333" text-anchor="middle" class="b">专业 Agent / 本地状态</text><text x="310.0" y="364" text-anchor="middle" class="b">本地数据所有权 / 本地 PEP</text><text x="310.0" y="395" text-anchor="middle" class="b">专业执行与专业验收</text><rect x="710" y="210" width="500" height="340" rx="22" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.5"/><path d="M734 212H1186" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="252" text-anchor="middle" class="h">ADS 生态协调层</text><text x="960.0" y="293" text-anchor="middle" class="b">跨域能力注册与发现</text><text x="960.0" y="324" text-anchor="middle" class="b">Ontology 共同语义治理</text><text x="960.0" y="355" text-anchor="middle" class="b">授权协调 / 资源预算 / 审计</text><text x="960.0" y="386" text-anchor="middle" class="b">风险升级 / 群体评估与进化</text><text x="960.0" y="417" text-anchor="middle" class="b">ADS 自身执行 / 管理 / 考核</text><rect x="1360" y="250" width="500" height="260" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M1384 252H1836" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1610.0" y="292" text-anchor="middle" class="h">个人助理 / 领域 B</text><text x="1610.0" y="333" text-anchor="middle" class="b">私有记忆 / 本地状态</text><text x="1610.0" y="364" text-anchor="middle" class="b">授权投影 / 本地 PEP</text><text x="1610.0" y="395" text-anchor="middle" class="b">个人或领域成长闭环</text><path d="M560 380L700 380" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M690 372L700 380L690 388" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1210 380L1350 380" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M1340 372L1350 380L1340 388" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="250" y="700" width="1420" height="200" rx="22" fill="url(#glass)" stroke="#FF6D7A" stroke-width="2.5"/><path d="M274 702H1646" stroke="#FF6D7A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="742" text-anchor="middle" class="h">人类外环治理</text><text x="960.0" y="783" text-anchor="middle" class="b">关键授权 / 高风险审批 / 独立验证 / 否决 / 接管 / 最终问责</text><text x="960.0" y="814" text-anchor="middle" class="b">内环自治执行，外环动态治理；共享能力升级必须经过领域适配和验证</text><path d="M960 550L960 680" stroke="#FFC76A" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M950 672L960 680L950 688" stroke="#FFC76A" stroke-width="3" fill="none"/></svg>