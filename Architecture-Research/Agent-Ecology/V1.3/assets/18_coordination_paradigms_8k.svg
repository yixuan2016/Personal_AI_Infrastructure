<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04101F"/><stop offset=".58" stop-color="#09213B"/><stop offset="1" stop-color="#061426"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183958"/><stop offset="1" stop-color="#091B30"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3B7192" stroke-opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:40px;font-weight:700;fill:#F3F8FF}
.st{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:19px;fill:#B7C9D9}
.h{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:24px;font-weight:700;fill:#F3F8FF}
.b{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:17px;fill:#B7C9D9}
.s{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#B7C9D9}
</style></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<text x="960" y="70" text-anchor="middle" class="t">V1.3｜三种多 Agent 协作范式</text>
<text x="960" y="112" text-anchor="middle" class="st">集中式编排、事件驱动与环境痕迹驱动：状态载体、控制权与适用边界</text>
<text x="1845" y="70" text-anchor="end" class="s">18 | PARADIGMS</text><rect x="80" y="220" width="520" height="250" rx="22" fill="url(#glass)" stroke="#3B91FF" stroke-width="2.5"/><path d="M104 222H576" stroke="#3B91FF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="340.0" y="262" text-anchor="middle" class="h">集中式 Orchestration</text><text x="340.0" y="303" text-anchor="middle" class="b">中央规划器分解、分配与验收</text><text x="340.0" y="334" text-anchor="middle" class="b">全局控制直观；中心瓶颈与单点风险</text><rect x="700" y="220" width="520" height="250" rx="22" fill="url(#glass)" stroke="#A78BFA" stroke-width="2.5"/><path d="M724 222H1196" stroke="#A78BFA" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="262" text-anchor="middle" class="h">事件驱动 Choreography</text><text x="960.0" y="303" text-anchor="middle" class="b">发布订阅、事件触发、异步响应</text><text x="960.0" y="334" text-anchor="middle" class="b">时间解耦；事件链语义分散</text><rect x="1320" y="220" width="520" height="250" rx="22" fill="url(#glass)" stroke="#27E0B1" stroke-width="2.5"/><path d="M1344 222H1816" stroke="#27E0B1" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="1580.0" y="262" text-anchor="middle" class="h">环境驱动 Stigmergy</text><text x="1580.0" y="303" text-anchor="middle" class="b">读取共同状态、留下痕迹、接力行动</text><text x="1580.0" y="334" text-anchor="middle" class="b">局部自治；需治理冲突与陈旧痕迹</text><path d="M340 470L960 640" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M950 632L960 640L950 648" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M960 470L960 640" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M950 632L960 640L950 648" stroke="#24D8F2" stroke-width="3" fill="none"/><path d="M1580 470L960 640" stroke="#24D8F2" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M950 632L960 640L950 648" stroke="#24D8F2" stroke-width="3" fill="none"/><rect x="230" y="660" width="1460" height="230" rx="22" fill="url(#glass)" stroke="#FFC76A" stroke-width="2.5"/><path d="M254 662H1666" stroke="#FFC76A" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/><text x="960.0" y="702" text-anchor="middle" class="h">混合 Agent Ecology</text><text x="960.0" y="743" text-anchor="middle" class="b">环境负责持久上下文与任务发现｜事件负责唤醒｜A2A 负责必要协商</text><text x="960.0" y="774" text-anchor="middle" class="b">ADS 负责身份、策略、跨域授权和审计｜领域保留专业执行与验收</text></svg>