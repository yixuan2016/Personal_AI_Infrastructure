<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#132a45"/></linearGradient>
 <style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#e8f4ff}.h{font-size:36px;font-weight:700}.s{font-size:24px}.m{font-size:19px}.b{fill:#0d2b45;stroke:#38bdf8;stroke-width:2;rx:18}.g{fill:#103a3e;stroke:#34d399;stroke-width:2;rx:18}.y{fill:#3b2d18;stroke:#fbbf24;stroke-width:2;rx:18}.a{stroke:#67e8f9;stroke-width:4;fill:none;marker-end:url(#arr)}</style>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
