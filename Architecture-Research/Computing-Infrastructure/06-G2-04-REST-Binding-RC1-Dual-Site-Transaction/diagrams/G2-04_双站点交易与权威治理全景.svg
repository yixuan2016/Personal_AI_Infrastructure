<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2a"/><stop offset="1" stop-color="#213a50"/></linearGradient><linearGradient id="sco" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#265a73"/><stop offset="1" stop-color="#367d8c"/></linearGradient><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef5f8}.title{font-size:48px;font-weight:700}.head{font-size:28px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#c2d2dc}.box{fill:#1e4055;stroke:#86b3c8;stroke-width:2}.local{fill:#243e55;stroke:#9cb5c5;stroke-width:2}.line{stroke:#94bed0;stroke-width:3;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#94bed0"/></marker></defs>
<rect width="2400" height="1600" fill="url(#bg)"/><text x="1200" y="80" text-anchor="middle" class="title">G2-04｜双站点联邦任务交易与权威治理</text><text x="1200" y="125" text-anchor="middle" class="small">REST Binding RC1 · Prepare / Commit / Activation Barrier · Saga 补偿 · 独立验收</text>
<rect x="130" y="180" width="2140" height="210" rx="24" fill="url(#sco)" stroke="#a5c8d5" stroke-width="2"/><text x="1200" y="235" text-anchor="middle" class="head">SCO｜全局交易协调（只对编排记录负责）</text><text x="1200" y="285" text-anchor="middle" class="body">Contract / Plan / Saga / FederatedTaskTransaction / Activation Barrier</text><text x="1200" y="335" text-anchor="middle" class="small">收集签名回执、核验状态版本、推进全局阶段；不签发站点本地 Lease / TaskClaim</text>
<rect x="130" y="455" width="600" height="230" rx="20" class="box"/><text x="430" y="505" text-anchor="middle" class="head">ADS｜横向治理协同</text><text x="430" y="550" text-anchor="middle" class="body">Identity / Trust / Policy / Ontology</text><text x="430" y="590" text-anchor="middle" class="body">Capability / DataSpace / Revocation</text><text x="430" y="640" text-anchor="middle" class="small">目标 Owner PDP 签发 Decision；ADS 不自授 Permit</text>
<rect x="900" y="455" width="600" height="230" rx="20" class="box"/><text x="1200" y="505" text-anchor="middle" class="head">Activation Barrier</text><text x="1200" y="550" text-anchor="middle" class="body">Contract digest + 双站点 CommitReceipt</text><text x="1200" y="590" text-anchor="middle" class="body">Policy / Grant / Trust / Attestation / TTL</text><text x="1200" y="640" text-anchor="middle" class="small">任何必需条件 Unknown / Deny / Expired → 不激活</text>
<rect x="1670" y="455" width="600" height="230" rx="20" class="box"/><text x="1970" y="505" text-anchor="middle" class="head">Saga / Recovery</text><text x="1970" y="550" text-anchor="middle" class="body">Idempotency / Reconcile / Fencing</text><text x="1970" y="590" text-anchor="middle" class="body">Compensation / Human Escalation</text><text x="1970" y="640" text-anchor="middle" class="small">Unknown 先对账；补偿是追加事实，不是历史回滚</text>
<path d="M730 570 L890 570" class="line" marker-end="url(#arrow)"/><path d="M1500 570 L1660 570" class="line" marker-end="url(#arrow)"/><path d="M1200 390 L1200 445" class="line" marker-end="url(#arrow)"/>
<rect x="130" y="760" width="1020" height="480" rx="22" class="local"/><text x="640" y="815" text-anchor="middle" class="head">Site A｜本地权威执行面</text><rect x="200" y="860" width="400" height="140" rx="16" class="box"/><text x="400" y="910" text-anchor="middle" class="head">Reservation Authority</text><text x="400" y="955" text-anchor="middle" class="body">PrepareReceipt / Reservation</text><rect x="670" y="860" width="400" height="140" rx="16" class="box"/><text x="870" y="910" text-anchor="middle" class="head">Lease Authority</text><text x="870" y="955" text-anchor="middle" class="body">Lease / FencingToken</text><rect x="200" y="1040" width="400" height="140" rx="16" class="box"/><text x="400" y="1090" text-anchor="middle" class="head">Local Task Coordinator</text><text x="400" y="1135" text-anchor="middle" class="body">TaskClaim / TaskRun</text><rect x="670" y="1040" width="400" height="140" rx="16" class="box"/><text x="870" y="1090" text-anchor="middle" class="head">PDP / PEP / Data Owner</text><text x="870" y="1135" text-anchor="middle" class="body">本地授权与数据访问</text>
<rect x="1250" y="760" width="1020" height="480" rx="22" class="local"/><text x="1760" y="815" text-anchor="middle" class="head">Site B｜本地权威执行面（独立对称）</text><rect x="1320" y="860" width="400" height="140" rx="16" class="box"/><text x="1520" y="910" text-anchor="middle" class="head">Reservation Authority</text><text x="1520" y="955" text-anchor="middle" class="body">PrepareReceipt / Reservation</text><rect x="1790" y="860" width="400" height="140" rx="16" class="box"/><text x="1990" y="910" text-anchor="middle" class="head">Lease Authority</text><text x="1990" y="955" text-anchor="middle" class="body">Lease / FencingToken</text><rect x="1320" y="1040" width="400" height="140" rx="16" class="box"/><text x="1520" y="1090" text-anchor="middle" class="head">Local Task Coordinator</text><text x="1520" y="1135" text-anchor="middle" class="body">TaskClaim / TaskRun</text><rect x="1790" y="1040" width="400" height="140" rx="16" class="box"/><text x="1990" y="1090" text-anchor="middle" class="head">PDP / PEP / Data Owner</text><text x="1990" y="1135" text-anchor="middle" class="body">本地授权与数据访问</text>
<path d="M950 685 L640 750" class="line" marker-end="url(#arrow)"/><path d="M1450 685 L1760 750" class="line" marker-end="url(#arrow)"/>
<text x="1200" y="1335" text-anchor="middle" class="head">执行闭环：Result / Evidence → Independent Acceptance → Metering → Settlement</text><text x="1200" y="1390" text-anchor="middle" class="body">Operation Accepted ≠ 资源已预留 ｜ Plan Selected ≠ Lease 已签发 ｜ Result Submitted ≠ Acceptance Passed</text><text x="1200" y="1450" text-anchor="middle" class="small">RC1 候选：Owner 签署、OpenAPI 工具链验证、双实现互操作与故障注入尚待完成</text></svg>