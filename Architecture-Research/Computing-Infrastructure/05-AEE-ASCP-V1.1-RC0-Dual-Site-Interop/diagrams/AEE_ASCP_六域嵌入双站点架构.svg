<rect class="nodeB" x="1265" y="790" width="320" height="145" rx="14"/>
<text x="1425" y="830" text-anchor="middle" class="nodeTitle">IAM / PDP / PEP</text><text x="1425" y="866" text-anchor="middle" class="nodeBody">身份 · Grant · 本地策略</text><text x="1425" y="897" text-anchor="middle" class="nodeBody">撤销与访问门禁</text>
<rect class="nodeB" x="1610" y="790" width="320" height="145" rx="14"/>
<text x="1770" y="830" text-anchor="middle" class="nodeTitle">Data Owner / Connector</text><text x="1770" y="866" text-anchor="middle" class="nodeBody">数据合同 · 用途 · 传输</text><text x="1770" y="897" text-anchor="middle" class="nodeBody">字段投影与驻留控制</text>
<rect class="nodeB" x="1955" y="790" width="320" height="145" rx="14"/>
<text x="2115" y="830" text-anchor="middle" class="nodeTitle">Lease Authority / Scheduler</text><text x="2115" y="866" text-anchor="middle" class="nodeBody">CPU / GPU · 本地资源租约</text><text x="2115" y="897" text-anchor="middle" class="nodeBody">FencingToken · 设施联锁</text>
<rect class="nodeB" x="1265" y="965" width="320" height="145" rx="14"/>
<text x="1425" y="1005" text-anchor="middle" class="nodeTitle">Task Coordinator</text><text x="1425" y="1041" text-anchor="middle" class="nodeBody">本地 TaskStage / TaskClaim</text><text x="1425" y="1072" text-anchor="middle" class="nodeBody">claim_epoch 独立于资源令牌</text>
<rect class="nodeB" x="1610" y="965" width="320" height="145" rx="14"/>
<text x="1770" y="1005" text-anchor="middle" class="nodeTitle">Evidence / Acceptance</text><text x="1770" y="1041" text-anchor="middle" class="nodeBody">回执 · 结果披露 · 独立验收</text><text x="1770" y="1072" text-anchor="middle" class="nodeBody">计量与证据保全</text>
<rect class="nodeB" x="1955" y="965" width="320" height="145" rx="14"/>
<text x="2115" y="1005" text-anchor="middle" class="nodeTitle">Outbox / Inbox / Audit</text><text x="2115" y="1041" text-anchor="middle" class="nodeBody">本地事件缓冲 · 去重 · 游标</text><text x="2115" y="1072" text-anchor="middle" class="nodeBody">断网恢复与审计证据</text>



<path class="dash" marker-end="url(#arrow)" d="M440 650 C440 680 630 675 630 700"/>
<path class="dash" marker-end="url(#arrow)" d="M440 650 C440 682 1770 675 1770 700"/>
<path class="line" marker-end="url(#arrow)" d="M1200 650 L1200 675 L975 675 L975 700"/>
<path class="line" marker-end="url(#arrow)" d="M1200 650 L1200 675 L2115 675 L2115 700"/>
