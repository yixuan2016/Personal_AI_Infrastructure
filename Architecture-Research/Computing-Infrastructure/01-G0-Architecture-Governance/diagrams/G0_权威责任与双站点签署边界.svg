<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1b2c3f"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#234e67"/><stop offset="1" stop-color="#2d6179"/></linearGradient>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eef4f8}
.title{font-size:48px;font-weight:700}.subtitle{font-size:23px;fill:#b9cbd7}
.head{font-size:29px;font-weight:700}.node{font-size:22px;font-weight:700}.body{font-size:18px;fill:#d1dee7}.small{font-size:16px;fill:#b9cbd7}
.box{fill:#1c3548;stroke:#7199ae;stroke-width:2}.boxb{fill:#28374f;stroke:#8496b4;stroke-width:2}.coord{fill:#294e61;stroke:#8ab5c9;stroke-width:2}
.arrow{stroke:#80abc0;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8aa5b7;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#a)}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#80abc0"/></marker>
</defs>
<rect width="2400" height="1350" fill="url(#bg)"/>
<text x="1200" y="75" text-anchor="middle" class="title">G0｜六域权威责任与双站点签署边界</text>
<text x="1200" y="118" text-anchor="middle" class="subtitle">Owner 分权 · RACI · 签署权威 · ADS/SCO 协调但不接管本地事实</text>
<rect x="100" y="155" width="2200" height="112" rx="22" fill="url(#top)" stroke="#83b5cc" stroke-width="2.5"/>
<text x="1200" y="198" text-anchor="middle" class="head">双边治理委员会 / Federation Governance Owners</text>
<text x="1200" y="235" text-anchor="middle" class="body">TrustAgreement · 成员准入 · Profile / Namespace 批准 · 重大风险接受 · 正式版本签署</text>

<rect x="100" y="315" width="500" height="180" rx="18" class="coord"/>
<text x="350" y="360" text-anchor="middle" class="node">ADS</text>
<text x="350" y="398" text-anchor="middle" class="body">联邦治理协调 / 环境与能力目录</text>
<text x="350" y="432" text-anchor="middle" class="body">Profile 注册投影 / 语义协调</text>
<text x="350" y="466" text-anchor="middle" class="small">不授予远端本地权限，不代签Owner义务</text>

<rect x="650" y="315" width="500" height="180" rx="18" class="coord"/>
<text x="900" y="360" text-anchor="middle" class="node">SCO</text>
<text x="900" y="398" text-anchor="middle" class="body">TaskContract / ContractGraph</text>
<text x="900" y="432" text-anchor="middle" class="body">Plan / Saga / ActivationBarrier汇总</text>
<text x="900" y="466" text-anchor="middle" class="small">不签本地TaskClaim或物理资源Lease</text>

<rect x="1200" y="315" width="500" height="180" rx="18" class="coord"/>
<text x="1450" y="360" text-anchor="middle" class="node">FWSX</text>
<text x="1450" y="398" text-anchor="middle" class="body">事件投递 / Cursor / 重试 / Replay</text>
<text x="1450" y="432" text-anchor="middle" class="body">跨站点传输与交付审计</text>
<text x="1450" y="466" text-anchor="middle" class="small">不拥有事件事实，不批准数据用途</text>

<rect x="1750" y="315" width="550" height="180" rx="18" class="coord"/>
<text x="2025" y="360" text-anchor="middle" class="node">A2A</text>
<text x="2025" y="398" text-anchor="middle" class="body">Agent Card / Message / Task / Artifact</text>
<text x="2025" y="432" text-anchor="middle" class="body">扩展声明与请求级激活</text>
<text x="2025" y="466" text-anchor="middle" class="small">协议交互不等于取得数据/资源授权</text>

<text x="1200" y="555" text-anchor="middle" class="head">六域 Owner：按对象事实与权利分别签署</text>
<g>
<rect x="100" y="595" width="345" height="160" rx="16" class="box"/>
