<text x="1772" y="638" text-anchor="middle" class="node">联邦任务</text><text x="1772" y="678" text-anchor="middle" class="body">SCO + Site Task Owner</text><text x="1772" y="714" text-anchor="middle" class="small">全局Saga / 本地TaskClaim</text>
<rect x="1975" y="595" width="325" height="160" rx="16" class="box"/>
<text x="2137" y="638" text-anchor="middle" class="node">证据与验收</text><text x="2137" y="678" text-anchor="middle" class="body">Evidence / Independent QA</text><text x="2137" y="714" text-anchor="middle" class="small">独立验收 / 计量 / 结算</text>
</g>

